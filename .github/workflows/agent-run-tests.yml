name: Agent Run Tests

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  agent-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install backend requirements
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r backend/requirements.txt

      - name: Run agent test script
        env:
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: ${{ secrets.CI_TEST_DB_NAME }}
          REACT_APP_BACKEND_URL: https://bragarmal-production.up.railway.app
        run: |
          source .venv/bin/activate
          python scripts/agent_run_tests.py
